<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="shortcut icon" href="favicon.ico">
    <title>英文學習互動平台</title>
    <style>
        html {
            box-sizing: border-box;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        html,
        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        canvas {
            display: block;
        }

        body {
            margin: 0;
        }

        #unity-container {
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100% !important;
            max-height: 100% !important;
            position: fixed;
            left: 0;
            top: 0;

            background: #231F20;
        }

        #loading-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-loading-bar {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #unity-progress-bar-empty {
            width: 80%;
            height: 24px;
            margin: 10px 20px 20px 10px;
            text-align: left;
            border: 1px solid white;
            padding: 2px;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: white;
        }

        .light #unity-progress-bar-empty {
            border-color: black;
        }

        .light #unity-progress-bar-full {
            background: black;
        }

        .spinner,
        .spinner:after {
            border-radius: 50%;
            width: 5em;
            height: 5em;
        }

        .spinner {
            margin: 10px;
            font-size: 10px;
            position: relative;
            text-indent: -9999em;
            border-top: 1.1em solid rgba(255, 255, 255, 0.2);
            border-right: 1.1em solid rgba(255, 255, 255, 0.2);
            border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
            border-left: 1.1em solid #ffffff;
            transform: translateZ(0);
            animation: spinner-spin 1.1s infinite linear;
        }

        @keyframes spinner-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

    <script>
        let Q1 = true;
        let Q2 = false;
        let Q3 = false;
        function move_preTest(direction) {
            if (direction === "up") {
                if (Q2) {
                    document.getElementById("sort_2").style.display = "none";
                    document.getElementById("sort_1").style.display = "block";
                    document.getElementById("sort_3").style.display = "none";
                    Q1 = true;
                    Q2 = false;
                    Q3 = false;
                } else if (Q3) {
                    document.getElementById("sort_3").style.display = "none";
                    document.getElementById("sort_2").style.display = "block";
                    document.getElementById("sort_1").style.display = "none";
                    Q1 = false;
                    Q2 = true;
                    Q3 = false;
                }
            } else if (direction === "down") {
                if (Q2) {
                    document.getElementById("sort_2").style.display = "none";
                    document.getElementById("sort_3").style.display = "block";
                    document.getElementById("sort_1").style.display = "none";
                    Q1 = false;
                    Q2 = false;
                    Q3 = true;
                } else if (Q1) {
                    document.getElementById("sort_3").style.display = "none";
                    document.getElementById("sort_2").style.display = "block";
                    document.getElementById("sort_1").style.display = "none";
                    Q1 = false;
                    Q2 = true;
                    Q3 = false;
                }

            }
        }
        function move_postTest(direction) {
            if (direction === "up") {
                if (Q2) {
                    document.getElementById("sort_5").style.display = "none";
                    document.getElementById("sort_4").style.display = "block";
                    document.getElementById("sort_6").style.display = "none";
                    Q1 = true;
                    Q2 = false;
                    Q3 = false;
                } else if (Q3) {
                    document.getElementById("sort_6").style.display = "none";
                    document.getElementById("sort_5").style.display = "block";
                    document.getElementById("sort_4").style.display = "none";
                    Q1 = false;
                    Q2 = true;
                    Q3 = false;
                }
            } else if (direction === "down") {
                if (Q2) {
                    document.getElementById("sort_5").style.display = "none";
                    document.getElementById("sort_6").style.display = "block";
                    document.getElementById("sort_4").style.display = "none";
                    Q1 = false;
                    Q2 = false;
                    Q3 = true;
                } else if (Q1) {
                    document.getElementById("sort_6").style.display = "none";
                    document.getElementById("sort_5").style.display = "block";
                    document.getElementById("sort_4").style.display = "none";
                    Q1 = false;
                    Q2 = true;
                    Q3 = false;
                }

            }
        }
        function fixUnityCanvasSize() {
            const canvas = document.getElementById("unity-canvas");
            if (!canvas) return;

            // unity 的畫布尺寸 = 視窗實際尺寸
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        // Chrome / Android / iOS Chrome 都支援
        window.addEventListener("orientationchange", () => {
            setTimeout(fixUnityCanvasSize, 300);
        });

        window.addEventListener("resize", fixUnityCanvasSize);
    </script>


    <script>
        document.getElementById("pre_test").style.display = "none"; // 關閉頁面

        function getDateTimeUserName() {
            const now = new Date();

            //取台灣時間
            const taipeiTime = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Taipei" }));

            const year = taipeiTime.getFullYear();
            const month = String(taipeiTime.getMonth() + 1).padStart(2, "0");
            const day = String(taipeiTime.getDate()).padStart(2, "0");
            const hour = String(taipeiTime.getHours()).padStart(2, "0");
            const minute = String(taipeiTime.getMinutes()).padStart(2, "0");
            const second = String(taipeiTime.getSeconds()).padStart(2, "0");

            return `${year}${month}${day}${hour}${minute}${second}`;
        }
        let extraNum = 0;

        document.querySelectorAll('input[name="patience"]').forEach(radio => {

            age = document.querySelector('input[name="age"]:checked')?.nextElementSibling.textContent.trim() || "";

            if (!gender || !age || !education || !patience) {
                alert("請完整填寫所有欄位！");
                return;
            }
            document.getElementById("modeSelector").style.display = "none"; // 關閉頁面
        }
        let question_1 = "";
        let question_2 = "";

        let pre_ans1 = "";
        let pre_ans2 = "";
        let pre_ans3 = "";

        let pro_ans1 = "";
        let pro_ans2 = "";
        let pro_ans3 = "";
        let recodeScene = "";
        function copyOneLabel(fromId, toId) {
            const from = document.querySelector(`label[for="${fromId}"]`);
            const to = document.querySelector(`label[for="${toId}"]`);
            if (from && to) {
                to.textContent = from.textContent;
            } else {
                console.warn("找不到 label:", fromId, toId);
            }
        }

        function copyLabelGroup(fromPrefix, toPrefix) {
            for (let i = 1; i <= 4; i++) {
                copyOneLabel(`${fromPrefix}_${i}`, `${toPrefix}_${i}`);
            }
        }

        function recodePreTest() {
            question_1 = document.getElementById('Q1_word')?.textContent.trim() || "";
            question_2 = document.getElementById('Q2_word')?.textContent.trim() || "";
            question_3 = document.getElementById('Q3_word')?.textContent.trim() || "";
            pre_ans1 = document.querySelector('input[name="test1"]:checked')?.nextElementSibling.textContent.trim() || "";
            pre_ans2 = document.querySelector('input[name="test2"]:checked')?.nextElementSibling.textContent.trim() || "";
            pre_ans3 = document.querySelector('input[name="test3"]:checked')?.nextElementSibling.textContent.trim() || "";

            if (!pre_ans1 || !pre_ans2 || !pre_ans3) {
                alert("請完整填寫所有欄位！");
                return;
            }
            document.getElementById("pre_test").style.display = "none";
            function copyGroup(fromId, toIds) {
                const src = document.querySelector(`label[for="${fromId}"]`);
                if (!src) return;

                toIds.forEach(toId => {
                    const dest = document.querySelector(`label[for="${toId}"]`);
                    if (dest) dest.textContent = src.textContent;
                });
            }

            //安全寫法
            copyLabelGroup("S1", "S4");  // Q1 → Q4
            copyLabelGroup("S2", "S5");  // Q2 → Q5
            copyLabelGroup("S3", "S6");  // Q3 → Q6


            document.getElementById("Q4_word").textContent =
                document.getElementById("Q1_word").textContent;

            document.getElementById("Q5_word").textContent =
                document.getElementById("Q2_word").textContent;

            document.getElementById("Q6_word").textContent =
                document.getElementById("Q3_word").textContent;

        function sendDataInChunks(data, chunkSize) {
            let index = 0;
            function sendNext() {
                if (index >= data.length) {
                    console.log("所有資料已傳送完成！");
                    return;
                }

                let chunk = data.slice(index, index + chunkSize);
                let jsonString = JSON.stringify(chunk);

                // 限制資料大小（再小心一些）
                if (jsonString.length > 1024 * 40) {
                    console.error("JSON 資料過大", jsonString.length);
                    index += chunkSize;
                    setTimeout(sendNext, 1000); // 延長延遲時間
                    return;
                }

                // 確保 Unity WebGL 已初始化
                if (window.uarGameInstance) {
                    try {
                        //console.log(`發送資料第 ${index + 1} 到 ${index + chunk.length} 筆`);
                        window.uarGameInstance.SendMessage('SaveInfo', 'GetData', jsonString);
                        //console.log(`已傳送第 ${index + 1} 到 ${index + chunk.length} 筆資料`);

                        index += chunkSize; // 更新 index
                        setTimeout(sendNext, 500); //延遲後遞迴呼叫
                    } catch (error) {
                        console.error("Unity 傳輸錯誤，重試中...", error);
                        setTimeout(sendNext, 2000); // 增加重試時間
                    }
                } else {
                    console.warn("Unity 尚未初始化，等待 1 秒後重試...");
                    setTimeout(sendNext, 2000); // 1 秒後重試
                }
            }

            sendNext();
        }

        //旋轉
        function RequestSensorPermission() {
            console.log("傳送給 Unity:");
            //向使用者請求感應器權限
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    //permissionState 回傳結果
                    .then(permissionState => {
                        //得到granted 就給權限
                        if (permissionState === 'granted') {
                            //deviceorientation 行動裝置的移動方向
                            window.addEventListener("deviceorientation", sendOrientationData);
                        }
                    })
                    .catch(console.error);
            } else {
                // 如果不需要手動請求權限（如 Android 或舊版 iOS）
                window.addEventListener("deviceorientation", sendOrientationData);
            }
        }

        let lastBeta = 0, lastGamma = 0, lastAlpha = 0, greaterThan = 0.4;
        function sendOrientationData(event) {
            if (window.uarGameInstance) {
                let gamma = event.gamma || 0;
                let beta = event.beta || 0;
                let alpha = event.alpha || 0;

                gamma = gamma * 1.2
                let deltaBeta = Math.abs(beta - lastBeta);
                let deltaAlpha = Math.abs(alpha - lastAlpha);
                let deltGamma = Math.abs(gamma - lastGamma);
                beta = beta * 5.2;

                if (deltGamma > 0.00001 && gamma > 20) {
                    beta = lastBeta;
                }

                lastBeta = beta;
                lastAlpha = alpha;
                lastGamma = gamma;

                let data = `${beta},${gamma},${deltGamma},${alpha},${deltaAlpha}`;
                window.uarGameInstance.SendMessage('CameraManager', 'UpdateCamera', data);
            }
        }
