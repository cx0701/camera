<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="shortcut icon" href="favicon.ico">
    <title>英文互動平台</title>
    <style>
        html {
            box-sizing: border-box;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        html,
        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        canvas {
            display: block;
        }

        body {
            margin: 0;
        }

        #unity-container {
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100% !important;
            max-height: 100% !important;
            position: fixed;
            left: 0;
            top: 0;

            background: #231F20;
        }

        #loading-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-loading-bar {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #unity-progress-bar-empty {
            width: 80%;
            height: 24px;
            margin: 10px 20px 20px 10px;
            text-align: left;
            border: 1px solid white;
            padding: 2px;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: white;
        }

        .light #unity-progress-bar-empty {
            border-color: black;
        }

        .light #unity-progress-bar-full {
            background: black;
        }

        .spinner,
        .spinner:after {
            border-radius: 50%;
            width: 5em;
            height: 5em;
        }

        .spinner {
            margin: 10px;
            font-size: 10px;
            position: relative;
            text-indent: -9999em;
            border-top: 1.1em solid rgba(255, 255, 255, 0.2);
            border-right: 1.1em solid rgba(255, 255, 255, 0.2);
            border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
            border-left: 1.1em solid #ffffff;
            transform: translateZ(0);
            animation: spinner-spin 1.1s infinite linear;
        }

        @keyframes spinner-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 桌機預設 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .prev-btn {
            margin-left: 2%;
        }

        .next-btn {
            margin-right: 2%;
        }

        .send-btn {
            padding-top: 50%;
        }

        /* 手機版 */
        @media (max-width: 800px) {
            .send-btn {
                padding-top: 35%;
            }

            .nav-btn {
                top: auto;
                bottom: 20%;
                transform: none;
                font-size: 2.5rem;
            }

            .prev-btn {
                left: 10%;
                height: 12%;
                width: 16%;
            }

            .btn-text {
                font-size: 28px;
            }

            .next-btn {
                right: 10%;
                height: 12%;
                width: 16%;
            }
        }

        .header-wrap {
            min-height: 48px;
        }

        .reload-btn {
            left: 0;
        }

        @media (max-width: 768px) {
            #pre_text {
                padding-left: 55px;
                /* 按鈕寬 + 緩衝 */
            }
        }

        /* 小手機版 */
        @media (max-width: 740px) {
            .send-btn {
                padding-top: 30%;
            }

            .nav-btn {
                top: auto;
                bottom: 20%;
                transform: none;
                font-size: 2.5rem;
            }

            .prev-btn {
                left: 10%;
                height: 12%;
                width: 16%;
            }

            .btn-text {
                font-size: 20px;
            }

            .next-btn {
                right: 10%;
                height: 12%;
                width: 16%;
            }
        }

        .header-wrap {
            min-height: 48px;
        }

        .reload-btn {
            left: 0;
        }
    </style>
</head>

    <script>
        document.getElementById("toeic_yes").addEventListener("change", function () {
            document.getElementById("toeic_input_wrapper").style.display = "block";
        });

        document.getElementById("toeic_no").addEventListener("change", function () {
            document.getElementById("toeic_input_wrapper").style.display = "none";
            document.getElementById("toeic_sc").value = "";
        });

        document.getElementById("GEPT_yes").addEventListener("change", function () {
            document.getElementById("gept_input_wrapper").style.display = "block";
        });

        document.getElementById("GEPT_no").addEventListener("change", function () {
            document.getElementById("gept_input_wrapper").style.display = "none";
            document.getElementById("GEPT_sc").value = "";
        });


        let showGender = true;
        let showExam = false;
        let showCass = false;
        document.getElementById("userInfo_1").style.display = "block";
        document.getElementById("userInfo_2").style.display = "none";
        document.getElementById("userInfo_3").style.display = "none";
        document.getElementById("send_1").classList.add("d-none");



        //userInfo_3
        function move_Info(direction) {
            if (direction === "up") {
                if (showExam) {
                    document.getElementById("userInfo_1").style.display = "block";
                    document.getElementById("userInfo_0").style.display = "block";
                    document.getElementById("userInfo_2").style.display = "none";
                    document.getElementById("userInfo_3").style.display = "none";
                    document.getElementById("send_1").classList.add("d-none");

                    showGender = true;
                    showExam = false;
                    showCass = false;
                } else if (showCass) {
                    document.getElementById("userInfo_2").style.display = "block";
                    document.getElementById("userInfo_0").style.display = "none";
                    document.getElementById("userInfo_1").style.display = "none";
                    document.getElementById("userInfo_3").style.display = "none";
                    document.getElementById("send_1").classList.add("d-none");

                    showGender = false;
                    showExam = true;
                    showCass = false;
                }
            } else if (direction === "down") {
                if (showGender) {
                    document.getElementById("userInfo_2").style.display = "block";
                    document.getElementById("userInfo_1").style.display = "none";
                    document.getElementById("userInfo_0").style.display = "none";
                    document.getElementById("userInfo_3").style.display = "none";

        function clearSelection() {

        // 產生題目
        function genQuestions(data, extraNum) {

            const total = data.length;
            const gap = Math.floor(total / 3);//初階 中等 困難

            let pool = [];

            for (let i = 0; i < 3; i++) {
                const start = i * gap;
                const end = (i === 2) ? total : start + gap;

                const segment = data.slice(start, end);
                const selected = getRandom(segment, extraNum);

                pool.push(...selected);
            }

            const selected3 = getRandom(pool, 3);//抽三題
            return { pool, selected3 };
        }


        // 從陣列中抽 n
        function getRandom(arr, n) {
            if (arr.length <= n) return [...arr];
            return [...arr].sort(() => Math.random() - 0.5).slice(0, n);
        }

        // 隨機打亂陣列的函式
        function shuffle_Match(array) {
            return array
                .map(value => ({ value, sort: Math.random() })) // 加上隨機權重
                .sort((a, b) => a.sort - b.sort)                // 依權重排序
                .map(({ value }) => value);                     // 取出原值
        }

        //配對題
        function randomMatchOpt(q) {

            q.forEach((item, idx) => {

                const correct = item.optionA;
                //記錄正確答案
                if (idx === 0) correct_1 = correct;
                if (idx === 1) correct_2 = correct;
                if (idx === 2) correct_3 = correct;
                //從題庫抓所有 optionA
                let allOptions = globalJsonData
                    .map(x => x.optionA)
                    .filter(o => o && o !== correct);

                //抽三個錯誤選項
                let wrongOptions = shuffle(allOptions).slice(0, 3);

                // 合併
                let ops = shuffle([correct, ...wrongOptions]);

                document.querySelector(`label[for="S${idx + 1}_1"]`).textContent = ops[0];
                document.querySelector(`label[for="S${idx + 1}_2"]`).textContent = ops[1];
                document.querySelector(`label[for="S${idx + 1}_3"]`).textContent = ops[2];
                document.querySelector(`label[for="S${idx + 1}_4"]`).textContent = ops[3];

            });

        }
        function clearWord(str) {
            return str + " ";

        function randomCardOpt(q) {
            q.forEach((item, idx) => {
                let ops = shuffle([item.optionA, item.optionB, item.optionC, item.answer]);
                // 記錄正確答案
                if (idx === 0) correct_1 = item.answer;
                if (idx === 1) correct_2 = item.answer;
                if (idx === 2) correct_3 = item.answer;
                document.querySelector(`label[for="S${idx + 1}_1"]`).textContent = ops[0];
                document.querySelector(`label[for="S${idx + 1}_2"]`).textContent = ops[1];
                document.querySelector(`label[for="S${idx + 1}_3"]`).textContent = ops[2];
                document.querySelector(`label[for="S${idx + 1}_4"]`).textContent = ops[3];
            });

        }
        function shuffle(arr) {
            return arr
                .map(x => ({ x, r: Math.random() }))
                .sort((a, b) => a.r - b.r)
                .map(obj => obj.x);
        }

        function sendDataInChunks(data, chunkSize) {
            let index = 0;
            function sendNext() {
                if (index >= data.length) {
                    console.log("所有資料已傳送完成！");
                    return;
                }

                let chunk = data.slice(index, index + chunkSize);
                let jsonString = JSON.stringify(chunk);

                // 限制資料大小（再小心一些）
                if (jsonString.length > 1024 * 40) {
                    console.error("JSON 資料過大", jsonString.length);
                    index += chunkSize;
                    setTimeout(sendNext, 1000); // 延長延遲時間
                    return;
                }

                // 確保 Unity WebGL 已初始化
                if (window.uarGameInstance) {
                    try {
                        //console.log(`發送資料第 ${index + 1} 到 ${index + chunk.length} 筆`);
                        window.uarGameInstance.SendMessage('SaveInfo', 'GetData', jsonString);
                        //console.log(`已傳送第 ${index + 1} 到 ${index + chunk.length} 筆資料`);

                        index += chunkSize; // 更新 index
                        setTimeout(sendNext, 500); //延遲後遞迴呼叫
                    } catch (error) {
                        console.error("Unity 傳輸錯誤，重試中...", error);
                        setTimeout(sendNext, 2000); // 增加重試時間
                    }
                } else {
                    console.warn("Unity 尚未初始化，等待 1 秒後重試...");
                    setTimeout(sendNext, 2000); // 1 秒後重試
                }
            }

            sendNext();
        }

            if (!imagePath) {

                return;
            }

            // 將圖片路徑加入佇列
            window.imageQueue.push(imagePath);

            // 如果是第一次呼叫或佇列剛加入，啟動發送流程
            if (window.imageQueue.length === 1 && window.currentIndex === 0) {
                sendNextImage();
            }

        function sendNextImage() {
            if (window.currentIndex >= window.imageQueue.length) {
                // 所有圖片已處理完畢
                console.log("所有圖片已發送至 Unity。");
                window.imageQueue = [];
                window.currentIndex = 0;
                return;
            }

            const imagePath = window.imageQueue[window.currentIndex];
            const imgElement = new Image();
            imgElement.src = imagePath;

            imgElement.onload = function () {
                fetch(imgElement.src)
                    .then(response => response.blob())
                    .then(blob => {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64String = reader.result.split(",")[1];

                            }

                            // 等 1 秒後再送下一張（避免 Unity 無法即時處理）
                            window.currentIndex++;
                            setTimeout(sendNextImage, 500); // 調大延遲可提高成功率

                        reader.readAsDataURL(blob);
                    })

        function RequestSensorPermission() {
            console.log("傳送給 Unity:");
            //向使用者請求感應器權限
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    //permissionState 回傳結果
                    .then(permissionState => {
                        //得到granted 就給權限
                        if (permissionState === 'granted') {
                            //deviceorientation 行動裝置的移動方向
                            window.addEventListener("deviceorientation", sendOrientationData);
                        }
                    })
                    .catch(console.error);
            } else {
                // 如果不需要手動請求權限（如 Android 或舊版 iOS）
                window.addEventListener("deviceorientation", sendOrientationData);
            }
        }

        let lastBeta = 0, lastGamma = 0, lastAlpha = 0, greaterThan = 0.4;
        function sendOrientationData(event) {
            if (window.uarGameInstance) {
                let gamma = event.gamma || 0;
                let beta = event.beta || 0;
                let alpha = event.alpha || 0;

                gamma = gamma * 1.2
                let deltaBeta = Math.abs(beta - lastBeta);
                let deltaAlpha = Math.abs(alpha - lastAlpha);
                let deltGamma = Math.abs(gamma - lastGamma);
                beta = beta * 5.2;

                if (deltGamma > 0.00001 && gamma > 20) {
                    beta = lastBeta;
                }

                lastBeta = beta;
                lastAlpha = alpha;
                lastGamma = gamma;

                let data = `${beta},${gamma},${deltGamma},${alpha},${deltaAlpha}`;
                window.uarGameInstance.SendMessage('CameraManager', 'UpdateCamera', data);
            }
        }

            document.getElementById("prevImageBtn").onclick = () => {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                updateImage();
            };

            document.getElementById("nextImageBtn").onclick = () => {
                currentIndex = (currentIndex + 1) % images.length;
                updateImage();
            };

            updateImage();
            modal.show();
        }
    </script>
</body>

</html>
